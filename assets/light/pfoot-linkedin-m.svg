<svg xmlns="http://www.w3.org/2000/svg" width="141.33" height="44" viewBox="0 0 141.33 44" role="img" aria-label="LinkedIn"><title>LinkedIn</title><style>@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes fo{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes gx{from{transform:scaleX(.001)}}@keyframes gy{from{transform:scaleY(.001)}}@keyframes pp{from{opacity:0;transform:scale(.3)}}@keyframes pl{50%{opacity:.3}}@keyframes bl{50%{opacity:0}}@keyframes ring{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.6)}}.fi{animation:fi .8s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .9s ease both}.dr{stroke-dasharray:1;animation:dr 1.6s cubic-bezier(.6,0,.2,1) both}.gx{transform-box:fill-box;transform-origin:left center;animation:gx 1.2s cubic-bezier(.2,.7,.2,1) both}.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy 1s cubic-bezier(.2,.7,.2,1) both}.pp{transform-box:fill-box;transform-origin:center;animation:pp .45s cubic-bezier(.3,1.5,.5,1) both}.pl{animation:pl 2.6s ease-in-out infinite}.bl{animation:bl 1.1s steps(1) infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}@keyframes fl{to{stroke-dashoffset:-20}}@keyframes br{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}@keyframes rs{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}@keyframes sl{from{transform:translateX(0)}to{transform:translateX(var(--run))}}.fl{stroke-dasharray:4 6;animation:fl 1.6s linear infinite}.br{transform-box:fill-box;transform-origin:left center;animation:br 4.8s ease-in-out infinite}.rs{transform-box:fill-box;transform-origin:center bottom;animation:rs 3.6s ease-in-out infinite}.tw{animation:tw 5.5s ease-in-out infinite}.sl{animation:sl 7s ease-in-out infinite alternate}@keyframes tr{to{stroke-dashoffset:-1}}@keyframes icd{0%{stroke-dashoffset:1}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}@keyframes wv{0%,